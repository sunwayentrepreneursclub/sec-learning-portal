<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEC Learning Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#0A0A0A; --muted:#6A6C66; --faint:#9A9C96;
  --board:#E8E9E6; --border:#CDCFC9; --border-strong:#0A0A0A;
  --amber:#2340D8; --amber-bright:#2340D8; --amber-soft:#E5E9FC; --amber-line:#B9C4F5;
  --green:#1D7A46; --green-soft:#E9F5EE; --red:#B3261E; --red-soft:#FDF3F2;
  --serif:'Archivo Black',system-ui,sans-serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:6px 6px 0 rgba(10,10,10,.08);
  --radius:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 10% -12%, rgba(35,64,216,.07), transparent 60%),
    radial-gradient(760px 480px at 108% 8%, rgba(35,64,216,.05), transparent 55%),
    var(--board);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--amber)}
::selection{background:var(--amber-soft)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;text-transform:uppercase}
.hidden{display:none!important}

/* ---------- brand ---------- */
.brand-mark{width:38px;height:38px;border-radius:999px;object-fit:cover;border:1.5px solid var(--ink);flex:none}
.brand-mark.lg{width:64px;height:64px}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1.5px solid var(--ink);border-radius:var(--radius);padding:11px 20px;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em;transition:transform .08s ease,background .12s,color .12s,border-color .12s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--amber);border-color:var(--amber);color:#fff}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#8E1E17;border-color:#8E1E17}
.btn-sm{padding:6px 12px;font-size:12px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:0;background:#fff;transition:border-color .12s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--amber)}
.err{background:var(--red-soft);color:var(--red);border-left:3px solid var(--red);border-radius:0;padding:10px 13px;font-size:14px;margin-bottom:14px}
.ok-note{background:var(--green-soft);color:var(--green);border-left:3px solid var(--green);border-radius:0;padding:10px 13px;font-size:14px;margin-bottom:14px}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:420px;background:var(--card);border:1.5px solid var(--ink);border-radius:0;box-shadow:var(--shadow);padding:40px 36px}
.login-head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px}
.login-head h1{font-size:24px;margin:16px 0 6px}
.tagline{font-family:var(--mono);color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.login-foot{text-align:center;margin-top:20px;font-size:13.5px}
.login-foot button{background:none;border:none;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.login-foot button:hover{color:var(--amber)}

/* ---------- topbar / shell ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 24px;background:#FAFAF8;border-bottom:1.5px solid var(--ink)}
.topbar .title{font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:0}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);border-radius:0;padding:5px 13px;font-family:var(--mono);font-size:12px;font-weight:600}
.shell{max-width:1080px;margin:0 auto;padding:32px 24px 80px}

/* ---------- dashboard ---------- */
.greeting{font-size:26px;margin-bottom:4px}
.role-badge{display:inline-block;font-family:var(--mono);font-size:12px;background:#fff;border:1px solid var(--border);border-radius:0;padding:4px 10px;color:var(--muted);margin:8px 0 22px;text-transform:uppercase;letter-spacing:.04em}
.overall{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);margin-bottom:28px}
.overall .lbl{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.pbar{height:8px;background:var(--board);border-radius:0;overflow:hidden;border:1px solid var(--border)}
.pbar>div{height:100%;background:var(--amber);border-radius:0;transition:width .5s ease}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.cards{grid-template-columns:1fr}.shell{padding:24px 16px 60px}}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.card .row{display:flex;gap:18px;align-items:flex-start}
.card h3{font-size:17px;line-height:1.3}
.card .desc{color:var(--muted);font-size:14px;margin-top:6px;text-transform:none}
.card .meta{font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;gap:14px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:0;padding:3px 11px;text-transform:uppercase;letter-spacing:.04em}
.chip.grey{background:var(--board);color:var(--muted)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.chip.green{background:var(--green-soft);color:var(--green)}
.ring{transform:rotate(-90deg)}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-wrap{position:relative;flex:none}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--amber)}

/* ---------- subject view ---------- */
.subj-layout{display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
@media(max-width:860px){.subj-layout{grid-template-columns:1fr}}
.sidebar{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);position:sticky;top:76px}
.sec-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-radius:0;padding:10px 11px;font-size:13.5px;color:var(--ink);line-height:1.35}
.sec-item:hover:not(:disabled){background:var(--amber-soft)}
.sec-item.active{background:var(--amber-soft);font-weight:600}
.sec-item:disabled{color:var(--faint);cursor:not-allowed}
.sec-dot{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1.5px solid var(--ink);color:var(--muted);background:#fff}
.sec-dot.progress{background:var(--amber);border-color:var(--amber);color:#fff}
.sec-dot.done{background:var(--ink);border-color:var(--ink);color:#fff}
.subj-main{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);min-height:420px;display:flex;flex-direction:column;overflow:hidden}
.back-link{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;padding:4px 0}
.back-link:hover{color:var(--amber)}

/* ---------- reader ---------- */
.reader-head{padding:26px 30px 0}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px}
.reader-head h1{font-size:22px;margin-bottom:4px}
.reader-body{padding:20px 30px 26px;overflow-y:auto;max-height:56vh}
.clause-block{border-left:3px solid var(--ink);background:var(--board);border-radius:0;padding:14px 18px;margin-bottom:16px}
.clause-label{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.clause-block p{white-space:pre-line;font-size:14.5px}
.clause-block.good{border-left-color:var(--green);background:var(--green-soft)}
.clause-block.good .clause-label{color:var(--green)}
.clause-block.bad{border-left-color:var(--red);background:var(--red-soft)}
.clause-block.bad .clause-label{color:var(--red)}
.clause-block.scenario{border-left-color:var(--amber);background:var(--amber-soft)}
.clause-block.scenario .clause-label{color:var(--amber)}
.level-group{margin-bottom:34px}
.level-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.level-head h2{font-size:16px;color:var(--muted)}
.level-head .lt{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-size:12px}
.card.locked{opacity:.55}
.card.locked .btn{pointer-events:none}
.timer-banner{margin:0 30px 24px;background:var(--amber-soft);border-left:3px solid var(--amber);border-radius:0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--amber)}
.timer-banner strong{font-variant-numeric:tabular-nums}

/* ---------- quiz ---------- */
.quiz-wrap{padding:30px}
.q-progress{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.q-text{font-family:var(--sans);font-weight:600;font-size:19px;line-height:1.45;margin-bottom:22px}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:11px;font-size:14.5px;line-height:1.45;transition:border-color .1s,background .1s}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--amber);background:var(--amber-soft)}
.opt .letter{flex:none;width:26px;height:26px;border-radius:50%;background:var(--board);border:1px solid var(--border);color:var(--ink);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.opt.sel .letter{background:var(--amber);border-color:var(--amber);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .letter{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.explain{font-size:13.5px;color:var(--red);background:var(--red-soft);border-radius:0;padding:10px 14px;margin:-4px 0 14px;border-left:3px solid var(--red)}
.quiz-foot{display:flex;justify-content:flex-end;margin-top:8px}

/* ---------- complete states ---------- */
.celebrate{padding:56px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.celebrate .big{font-size:52px;line-height:1}
.celebrate h2{font-size:24px}
.celebrate .stats{display:flex;gap:26px;color:var(--muted);font-size:14px;margin:6px 0 8px;flex-wrap:wrap;justify-content:center}
.celebrate .stats b{color:var(--ink);font-size:18px;display:block;font-family:var(--mono)}

/* ---------- admin ---------- */
.tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:1.5px solid var(--ink);padding-bottom:0}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 16px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tab.active{color:var(--amber);border-bottom-color:var(--amber)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:26px}
.stat{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat .n{font-family:var(--serif);font-size:26px;font-weight:400}
.stat .l{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:2px}
table.members{width:100%;border-collapse:collapse;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
table.members th{text-align:left;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:11px 14px;border-bottom:1.5px solid var(--ink);background:#FAFAF8}
table.members td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.members tr:last-child td{border-bottom:none}
table.members tbody tr{cursor:pointer}
table.members tbody tr:hover{background:var(--amber-soft)}
.minibar{width:90px;height:6px;background:var(--board);border-radius:0;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;border:1px solid var(--border)}
.minibar>div{height:100%;background:var(--amber)}
.del-x{background:none;border:none;color:var(--faint);font-size:16px;padding:4px 8px;border-radius:0}
.del-x:hover{color:var(--red);background:var(--red-soft)}
.panel-overlay{position:fixed;inset:0;background:rgba(10,10,10,.35);z-index:50}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--card);z-index:51;border-left:1.5px solid var(--ink);box-shadow:-12px 0 0 rgba(10,10,10,.04);overflow-y:auto;padding:28px;animation:slidein .22s ease}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.detail-panel h2{font-size:20px;margin-bottom:2px}
.detail-panel .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
table.breakdown{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px}
table.breakdown th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 8px;border-bottom:1.5px solid var(--ink)}
table.breakdown td{padding:8px;border-bottom:1px solid var(--border)}
details.attempts{margin-bottom:10px;border:1px solid var(--border);border-radius:0;padding:10px 14px;font-size:13px;background:#FAFAF8}
details.attempts summary{cursor:pointer;font-weight:600}
.att{margin:10px 0 4px;padding-left:8px;border-left:2px solid var(--border)}
.att .hd{font-weight:600;margin-bottom:4px}
.att .qr{color:var(--muted);margin-left:8px}
.att .qr .yes{color:var(--green)} .att .qr .no{color:var(--red)}
.flag{color:var(--amber);font-weight:700}
.gen-q{border:1px solid var(--border);border-radius:0;padding:16px;margin-bottom:14px;background:#fff}
.gen-q .qt{font-weight:600;margin-bottom:10px}
.gen-q .go{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:0;font-size:13.5px;margin-bottom:5px;border:1px solid transparent}
.gen-q .go.correct{background:var(--green-soft);border-color:#C4E3D0;font-weight:600}
.gen-q .ex{font-size:12.5px;color:var(--muted);margin-top:8px;font-style:italic}
.gen-q .acts{display:flex;gap:8px;margin-top:10px}
.warn-banner{background:var(--amber-soft);border-left:3px solid var(--amber);color:var(--amber);border-radius:0;padding:12px 16px;font-size:14px;margin-bottom:18px}
.reg-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.reg-row .em{flex:1;font-family:var(--mono);font-size:13px}
.settings-card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px;max-width:620px}
.settings-card h3{font-size:16px;margin-bottom:14px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- mobile ---------- */
@media(max-width:600px){
  html{-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  .login-wrap{padding:16px}
  .login-card{padding:28px 20px}
  .login-head h1{font-size:20px}
  .topbar{padding:10px 14px;gap:8px}
  .topbar .title{font-size:14px}
  .topbar .pill{display:none}
  .shell{padding:18px 14px 60px}
  .greeting{font-size:21px}
  .card{padding:18px}
  .subj-layout{gap:16px}
  .sidebar{position:static;padding:10px}
  .sec-item{padding:13px 11px;font-size:14px}
  .reader-head{padding:20px 18px 0}
  .reader-head h1{font-size:19px}
  .reader-body{padding:16px 18px 20px;max-height:none;overflow-y:visible}
  .clause-block{padding:12px 14px}
  .timer-banner{margin:0 18px 18px;padding:14px;flex-direction:column;align-items:stretch}
  .timer-banner button{width:100%}
  .quiz-wrap{padding:18px}
  .q-text{font-size:16px}
  .opt{padding:14px;font-size:14px}
  .btn{min-height:44px}
  .celebrate{padding:40px 18px}
  .celebrate .stats{gap:16px}
  table.members{display:block;overflow-x:auto;white-space:nowrap}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .detail-panel{padding:20px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#B45309"/>
</linearGradient></defs></svg>

<div id="app"></div>

<script>
/* ═══════════════ CONFIG ═══════════════ */
const SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbwMgKM70S0IESBpGoBGrbN6Ydshhkw_z9BfgQdijMI4N7JHBRDyE6IiTCkcM6To2vK2/exec";
const LOGO_SRC = "WhatsApp%20Image%202026-07-14%20at%2015.13.39.jpeg";

let sessionToken = sessionStorage.getItem("sec_token") || null;
let currentUser  = JSON.parse(sessionStorage.getItem("sec_user") || "null");

async function api(body) {
  if (sessionToken) body.token = sessionToken;
  const res = await fetch(SHEETS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  });
  return res.json();
}
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const $ = sel => document.querySelector(sel);
const app = document.getElementById("app");

/* ═══════════════ SUBJECT DATA — SEC CHARTER 2026–2027 (FINAL, 13 July 2026) ═══════════════ */
const SUBJECTS = [
  {
    id: "charter",
    level: 1,
    levelTitle: "Know SEC",
    title: "Level 1 — SEC Core: Club Charter 2026–2027",
    description: "Foundational governance document, based on the final Charter certified 13 July 2026. All committee members must complete this before taking on any responsibilities.",
    estimatedMinutes: 45,
    sections: [
      { id: "definitions", title: "Part 0 — Definitions & Role Codes", clauses: [
        { label:"Role codes are permanent", text:"Role codes (R-##) never change — only the title attached to a code can change each term. For the current title mapped to each code, always check Appendix A1, not this section." },
        { label:"ExCo / Executive Committee", text:"The President (R-01) and the four Vice Presidents (R-02 through R-05), collectively forming the Club's executive leadership." },
        { label:"President (R-01)", text:"The ExCo member designated President for the term: the Club's official representative and final escalation authority. R-01 permanently holds the Brand & Content portfolio (R-02) directly, in the same way the Treasurer Function (R-09) is permanently embedded under the VP, Events (R-05)." },
        { label:"Secretary (R-06), Club Auditor (R-08), AWI Officer (R-11)", text:"Three standalone Control & Support roles — none embedded in a single VP portfolio. All three operate under R-01's strategic direction and support all VP portfolios. R-08 keeps full independence on audit findings." },
        { label:"HOD / vHOD / Leader", text:"HOD (Head of Department) converts VP direction into executable departmental plans — current HOD codes are R-12, R-14, R-17, R-20. A vHOD or Parallel Leader owns a defined execution lane within a department — current codes are R-13, R-15, R-16, R-18, R-19, R-21." },
        { label:"Principal Advisor (R-00)", text:"The University-appointed faculty member serving as the Club's primary institutional advisor. Distinct from any Co-Advisor(s), who require separate institutional approval." },
        { label:"Second Party vs Third Party", text:"Second Party: any University/College staff, faculty, or administrator acting officially for the Club. Third Party: any external individual or organisation not affiliated with Sunway Education Group." },
        { label:"Tier 1 vs Tier 2 Member", text:"Tier 1 Member: a free Community Pool participant who has joined Sunway Nexus by SEC. Tier 2 Member: a registered, paid Active SEC Member — the tier that carries Committee eligibility." },
        { label:"Unauthorised Person", text:"Any individual not formally permitted to access specific Club information, documents, discussions, records, decisions, or communication channels under this Charter." },
        { label:"Sunway Nexus by SEC", text:"SEC's cross-campus community platform connecting entrepreneurs, mentors, sponsors, startups, and partner clubs — a hybrid digital and physical ecosystem." }
      ]},
      { id: "club-info", title: "Part 1 — Club Information: Vision, Mission & Objectives", clauses: [
        { label:"1.1 Name and Contact", text:"Sunway Entrepreneurs Club (SEC). Email: sunwayentrepreneursclub@gmail.com. Instagram: @sunwayentrepreneurs. Address: Sunway University, 5, Jalan Universiti, Bandar Sunway, 47500 Subang Jaya, Selangor." },
        { label:"1.2 Vision", text:"To be Sunway University's leading entrepreneurship ecosystem — a self-sustaining platform of digital authority, owned community, and proven execution that produces operators, not just members, and that strengthens with every committee handover rather than resetting to zero." },
        { label:"1.3 Mission", text:"To build a community of aspiring entrepreneurs and innovators, fostering real-world skills, professional connections, and opportunities beyond campus to help members turn their ideas into reality and become future business leaders." },
        { label:"1.4 Objectives", text:"Develop operators, not just members; build digital authority as SEC's entry point for strangers and sponsors; build owned community infrastructure (Sunway Nexus by SEC) to reduce dependence on cold outreach; run an activation platform of documented, repeatable events; build institutional assets (the D-01–D-07 document system) so each committee inherits a working system; and provide real-world internship/working-experience pathways." },
        { label:"1.5 Powers", text:"The Club has the same powers as an individual, subject to this Charter. It may exercise those powers, and use its income and assets, only for the purposes set out in its Vision, Mission, and Objectives, and in accordance with University, Student LIFE, and SUSC/SCC requirements." }
      ]},
      { id: "membership", title: "Part 2 — Activities, Efforts & Membership", clauses: [
        { label:"2.1(A) Programmes", text:"Knowledge & Access Programmes (exposure to real operators, firms, tools); Lifestyle & Community Programmes (recurring, low-pressure culture-building); and the Annual Capstone Event (marks the year's efforts and the formal handover). Talk segments and cross-club inclusion apply across all of these rather than as separate event types." },
        { label:"2.1(B)–(C) Digital infrastructure & pathways", text:"SEC owns and operates Sunway Nexus by SEC (the community platform) and its digital promotion channel (social media, the entry point for new audiences and sponsor credibility), plus internship/collaboration pathways through Sunway Education Group and industry partners." },
        { label:"Tier 1 Membership — free", text:"Open to Sunway University/College students, students at recognised partner institutions, Sunway Education Group alumni, and external partners via Sunway Nexus by SEC. Entitled to: relevant WhatsApp sub-group access, public-event invitations, sponsor exposure via their club, general Digital Channel content. Not entitled to: voting rights, priority registration, discounted/free ticketed entry, a year-end certificate, direct sponsor connection, or committee eligibility." },
        { label:"Tier 2 Membership — RM10", text:"Requires an RM10 fee via bank transfer or QR code, receipted and recorded by R-09. Entitled to: priority registration for limited-seat events, free/discounted ticketed entry, committee eligibility, a year-end certificate, and direct network connection." },
        { label:"Voluntary participation", text:"Participation is voluntary — Tier 2 membership is NOT contingent on minimum attendance, and a member is never marked inactive solely for non-attendance. SEC does not compel attendance; where an event delivers genuine value, members attend by choice." },
        { label:"Termination", text:"Grounds: damaging Club property, harassment, or an ethics violation. Minimum process: written notice of grounds; at least 7 days for the member to respond in writing; a documented decision by R-03 (VP, People & Operations); one right of appeal to R-01." },
        { label:"Member Register & data handling", text:"The Member Register (name, iMail, tier, join/termination date) is submitted to Student LIFE monthly. Personal data is collected only for registration, administration, and communication; access is restricted to authorised committee members; former members may request deletion through R-03." },
        { label:"2.3 Professional designation", text:"Active Tier 2 Members may use \"Nexus Associate, Sunway Entrepreneurs Club\" on external platforms. It confers no committee authority or representation rights, and SEC may revoke it for misconduct or misuse." }
      ]},
      { id: "meetings", title: "Part 3 — General Meetings: AGM & EGM", clauses: [
        { label:"3.0 Voting rights rest with the Committee", text:"Members (Tier 1 and Tier 2) hold no decision-making or voting rights and take no part in any vote — governance rests entirely with the Committee, overseen by R-00 and Student LIFE. An eligible voter is a committee member holding a named role; each holds one vote regardless of how many embedded roles they carry; ties are broken by R-01." },
        { label:"3.1 Annual General Meeting", text:"Convened annually at term end to elect/appoint the incoming committee. Valid only when: chaired by R-01; attended by at least 70% of active committee members; supervised by at least one Student LIFE and one SUSC/SCC representative; the incoming committee is successfully elected; and finances, assets, and all D-01–D-07 documents are formally handed over. Minutes go to Student LIFE and SUSC/SCC." },
        { label:"3.2 Extraordinary General Meeting", text:"A special meeting for urgent matters, convenable only if petitioned by at least 70% of active committee members (who set the date, time, venue, and agenda beforehand). Valid only when: chaired by a Student LIFE representative (not R-01, unlike the AGM); attended by at least 70% of active committee members; supervised by at least one SUSC/SCC representative; and the agenda is successfully resolved." }
      ]},
      { id: "committee-structure", title: "Part 4.1–4.5 — Committee Composition & Executive Structure", clauses: [
        { label:"4.1–4.2 Term of office", text:"The committee's term runs 1 March to the last day of February the following year, unless Student LIFE or SUSC/SCC determines otherwise. The financial term follows the same period." },
        { label:"4.3 Eligibility", text:"Any Tier 2 Member is eligible for a committee role, subject to role-specific qualifications (e.g. R-08's finance background). Final-year students and interning members are NOT barred — a trained deputy maintains continuity during any short overlap, per the \"train your replacement\" culture." },
        { label:"4.4.1 Executive structure", text:"Four Vice Presidents, one designated President for the term. R-01 permanently holds the Brand & Content portfolio (R-02) directly, the same way the Treasurer Function (R-09) is permanently embedded under the VP, Events (R-05) — this is not a term-specific arrangement." },
        { label:"4.4.2 Collective Executive Mode", text:"Each VP is the decision-maker for their own portfolio; no VP manages, overrides, or interferes with another VP's portfolio unless it affects their own or triggers escalation. Decisions are made at the lowest appropriate level. R-01 is not a day-to-day superior over other VPs — VPs decide independently; if disagreement or escalation arises, R-01 decides." },
        { label:"4.4.3 President (R-01)", text:"Official representative of the Club; primary contact for Student LIFE, advisors, sponsors, and external parties; final escalation authority for disputes, deadlocks, conflicts of interest, and high-impact decisions; strategic-direction provider for R-06, R-08, R-11. R-01 shall NOT manage day-to-day departmental operations, do routine execution work, or override a VP's domain decision without a valid escalation trigger." },
        { label:"4.4.4 Vice Presidents (R-02–R-05)", text:"Four portfolio leads, each responsible for portfolio direction, KPI movement, HOD support, resource allocation, and cross-department coordination within their domain. The Treasurer Function (R-09) sits operationally under R-05; Brand & Content (R-02) sits permanently under R-01." },
        { label:"4.4.5 Control & Support Officers", text:"Six officers: R-06 Secretary, R-07 Vice Secretary, R-08 Club Auditor, R-09 Treasurer, R-10 Vice Treasurer, R-11 AWI Officer. R-06, R-08, and R-11 are standalone — not embedded in any VP portfolio, all operating under R-01's strategic direction across all VP portfolios. R-08 retains full independence on audit findings and may not be directed on conclusions by any ExCo member, including R-01." },
        { label:"4.4.5.3 Club Auditor (R-08) qualification", text:"R-08 must have an accounting, finance, audit, or risk background and must have completed, be undertaking, or have secured a relevant professional internship. R-08 is appointed by the Executive Committee (not solely by R-05) and reviews, verifies, flags, and reports — R-08 does not approve budgets, authorise payments, or control departmental operations." },
        { label:"4.4.6 Departmental structure", text:"The standard hierarchy is VP → HOD → vHOD/Leader → Executives. Departments may run a parallel-leader structure where two or more leaders at the same level own distinct execution lanes under one HOD, approved by the relevant VP at term start." }
      ]},
      { id: "authority-governance", title: "Part 4.4.7–4.4.22 — Decision Rights, Escalation & Governance Rules", clauses: [
        { label:"4.4.7–4.4.8 HOD and vHOD roles", text:"A HOD owns departmental outcomes: prepares execution plans, coordinates members, manages timelines, ensures output quality, and reports to the relevant VP. A vHOD/Parallel Leader owns a defined execution lane, manages recurring operational tasks, and is never treated as a passive assistant." },
        { label:"4.4.9 Decision-making authority", text:"Task-level execution sits with the vHOD/Leader/assigned member; departmental execution with the HOD; portfolio direction with the relevant VP; financial approval with R-09/R-05 (subject to no-self-approval); disputes, deadlocks, conflicts of interest, and high-impact matters escalate to R-01. Decisions are made at the lowest appropriate level unless escalation is required." },
        { label:"4.4.10 Cross-portfolio decisions", text:"Where a matter touches two or more of Finance, Events, Partnerships, Brand & Content, member management, external representation, Student LIFE compliance, or Club-wide reputation/risk, the relevant VPs must align — within 48 hours, or the matter escalates to R-01." },
        { label:"4.4.11 When to escalate to R-01", text:"Escalate when: two or more VPs disagree; a decision is unresolved past 48 hours; a conflict of interest exists; someone must approve their own work/budget/reimbursement; the matter carries significant financial exposure or external reputational risk; it affects Student LIFE, advisors, sponsors, or the whole Club; or the existing structure can't resolve it. R-01's decision on an escalated matter is final and binding." },
        { label:"4.4.12 Limits on presidential authority", text:"R-01 shall not intervene in routine portfolio decisions, override a VP without a genuine escalation trigger, manage departmental execution, or use veto for personal preference. R-01 is inactive by default and decisive only when escalation is triggered." },
        { label:"4.4.13 No-self-approval rule", text:"No one may approve an activity, budget, reimbursement, payment, proposal, or decision they are directly involved in as executor or beneficiary — approval transfers to R-01 or a neutral VP instead. R-10 may never approve their own reconciliation work; R-08 may never audit work they were directly involved in." },
        { label:"4.4.14 Financial control principles", text:"R-09/R-05 holds budget approval authority; where they're directly involved, approval escalates to R-01 or a neutral VP. Rules: no budget, no event; no proposal, no approval; no documentation, no reimbursement; no post-event report, no next event approval (unless waived by ExCo)." },
        { label:"4.4.15 Default-to-action rules", text:"No response within 24 hours of confirmed receipt → the responsible officer proceeds with the last agreed direction. No cross-portfolio alignment within 48 hours → escalates to R-01. Owner unavailable → the next designated role temporarily assumes responsibility. Task blocked over 48 hours → escalates to the relevant VP." },
        { label:"4.4.16–4.4.17 Ownership & documentation", text:"Every task, project, event, partnership, or governance requirement needs a named responsible owner, an accountable officer, a deadline, and a visible status — never assigned generally to 'the team.' Each department remains responsible for its own records; R-06 tracks completeness but doesn't do the recording for them." },
        { label:"4.4.19 Role fallback", text:"If a vHOD/Leader fails to perform, the HOD temporarily assumes responsibility; if a HOD fails, the relevant VP does, and may recommend replacement; if a VP fails, R-01 may temporarily reallocate the portfolio, subject to ExCo review. Replacement should happen within 14 days where the failure materially affects operations. A vacancy alone never dissolves the Club." },
        { label:"4.4.20 Governance failures", text:"Treated as governance failures: approving your own work; a department operating without records; a project or event proceeding without a named owner and approved budget; repeated failure to report; a VP interfering in another's domain without escalation basis; R-01 overriding a domain decision without a valid trigger; misuse of AI tools involving confidential or personal information; or R-11 changing Club digital infrastructure without ExCo approval." },
        { label:"4.4.21 Confidentiality & authority integrity", text:"Committee members must not disclose, forward, screenshot, or share internal Club information with any Unauthorised Person, and may not represent the Club externally or claim authority beyond their formal role unless authorised by R-01 or the relevant VP." },
        { label:"4.5 Leadership development duty", text:"Every ExCo member must set clear expectations and give direction before demanding results. VPs must check in with HODs at least every two weeks, and cannot raise a formal complaint about a subordinate without a documented record of prior guidance attempts." }
      ]},
      { id: "no-confidence", title: "Part 4.6 — Vote of No Confidence & Leadership Removal", clauses: [
        { label:"Grounds", text:"A Vote of No Confidence may target any ExCo member, including R-01, on documented grounds: persistent misconduct (2+ incidents in 30 days); failure to lead (2 missed reporting cycles or a 14+ day breakdown); repeated absence (2 consecutive missed meetings, or 3 non-participations in 30 days); a verified financial/approval/conflict-of-interest breach; improper removal of another member without due process; or verified misrepresentation of authority." },
        { label:"Who may initiate", text:"Two or more VPs jointly, three or more HODs jointly, or a majority of the combined ExCo+HOD layer. If R-01 is the subject, R-04 or another neutral VP manages the process instead." },
        { label:"Conduct during the process", text:"No campaigning through official channels, no coercion, discussion confined to the formal deliberation session with evidence-based arguments only, and an independent secret ballot." },
        { label:"Process — steps 1 to 4", text:"Step 1: formal written notice with evidence, issued to the affected party and R-01 (or R-04 if R-01 is the subject). Step 2: the affected party has 72 hours to respond in writing (extendable 24 hours for exams/medical/family emergencies). Step 3: deliberation chaired by R-00, or a Student LIFE representative if unavailable. Step 4: a secret ballot among all ExCo, all HODs, and members of 2+ months' standing." },
        { label:"Process — steps 5 to 6 (threshold & outcome)", text:"At least 80% of eligible voters must participate; removal needs a two-thirds supermajority. If quorum fails, the vote reconvenes within 7 days; if the threshold fails, no repeat vote on the same allegations for 60 days. If the threshold is met, the member's role is immediately frozen, R-00 reviews the grounds, and removal is finalised only on Student LIFE's endorsement." },
        { label:"Electing a replacement", text:"An open call for nominations issues within 48 hours of removal. Any committee member of 4+ weeks' standing may be nominated with written consent. Election is by secret ballot among ExCo and HODs, simple majority, R-00 breaking any tie. A documented handover completes within 7 days." },
        { label:"Preventing repeat failures", text:"All incoming ExCo members must complete onboarding and sign an acknowledgement of the Charter within 14 days. R-01 conducts a formal mid-term review of all VPs, documented and shared with R-00. A structured end-of-term debrief is handed to the successor committee." }
      ]},
      { id: "finance", title: "Part 5 — Finances & Assets", clauses: [
        { label:"5.2 Source of funds", text:"Tier 2 membership fees; business ventures and events run by the Club; sponsorship income and in-kind contributions; subsidies allocated by Student LIFE; and any other source that abides by University rules." },
        { label:"5.3 Management of funds", text:"True and fair accounts must be kept; all membership fees collected via bank transfer or QR code with proof retained; no event may be financially confirmed without prior R-09/R-05 approval; financial statements go to Student LIFE monthly; all funds are handed to the incoming committee at term end." },
        { label:"5.4 Management of assets", text:"Club assets include the Sunway Nexus by SEC WhatsApp Community and sub-groups, the Sponsor Directory, Digital Channel accounts/credentials, event documentation, and physical equipment — all owned by the Club, never by an individual, and all handed over at a formal meeting. R-08 may review asset records and handover completeness." },
        { label:"5.5 Digital account security — password & access", text:"All official account passwords change within 14 days of each new term (coordinated by R-06 with R-01), never shared via personal messaging apps. Access to Club accounts is revoked within 48 hours of any committee member leaving. Changing the primary Club email password needs at least two ExCo members (Two-Person Rule) — no single individual may unilaterally lock or change access." },
        { label:"5.5 Credential record", text:"R-06 maintains an up-to-date credential record for all official accounts, updated on every password change, stored securely, and formally handed over at the AGM. R-11 may maintain and develop Club digital infrastructure but shall not unilaterally control accounts beyond that mandate — core credential changes still need R-01 and R-06 approval." },
        { label:"5.6 Liabilities", text:"The Club accepts any loss of funds/assets as non-recoverable; individual committee members are never personally liable for the Club's liabilities. Severe or sustained financial insolvency may lead to suspension, restructuring, or dissolution, subject to Student LIFE/SUSC-SCC review." }
      ]},
      { id: "legalities", title: "Part 6 — Legalities", clauses: [
        { label:"6.1 Liability release", text:"Any liability release/disclaimer must be Student LIFE-endorsed to take effect; any event with physical activity needs a Student LIFE-endorsed waiver beforehand. R-11 must ensure any digital data-collection form complies with data handling standards and is approved by R-01 before deployment." },
        { label:"6.2 Conflict of interest", text:"A committee member with a personal financial interest or relationship with a sponsor, partner, or party in a Club decision must declare it to R-01 or the relevant VP and recuse themselves — the decision then passes to a neutral party or escalates to R-01. R-08 must declare any conflict before reviewing any matter." },
        { label:"6.3 Advisor", text:"R-00 (Principal Advisor) is University-appointed; the Club may also have Co-Advisors with institutional approval. Advisors may freely contribute to decision-making but may never make a decision on the Club's behalf without committee consent." },
        { label:"6.4–6.5 Second Party & Third Party", text:"The Second Party (University/College staff) may be partially involved in decision-making. The Third Party (external, non-affiliated individuals/organisations) must NOT be involved in any decision-making. Either may be replaced via a written request, a signed committee petition, SUSC/SCC approval, and Student LIFE endorsement." },
        { label:"6.6 Amendment of Charter", text:"An amendment may only be proposed at an EGM, taking effect only with two-thirds approval of eligible voters present, SUSC/SCC approval, and Student LIFE endorsement. Appendices A1–A4 (role, document, department, and event codes) may be updated each term by the incoming ExCo without a formal EGM, provided no update creates new authority, removes rights, or contradicts the Charter's body." },
        { label:"6.7 Dissolution", text:"A dissolution proposal may only be made at an EGM, needing at least 75% approval of eligible voters present, SUSC/SCC approval, and Student LIFE endorsement. Remaining funds return to Sunway Education Group." }
      ]},
      { id: "role-registry", title: "Appendix A1 & B — Role Registry & RACI Framework", clauses: [
        { label:"How the registry works", text:"Role codes (R-##) are permanent; only titles change each term. Update Appendix A1 to reflect new titles — never rewrite the governance clauses themselves. Departments and codes: Brand & Content (DEP-01), Partnerships & Growth (DEP-02), People & Operations (DEP-03), Events (DEP-04)." },
        { label:"ExCo layer", text:"R-00 Principal Advisor (institutional oversight, external). R-01 President (final escalation, permanently holds R-02). R-02 VP Brand & Content (permanently under R-01). R-03 VP People & Operations. R-04 VP Partnerships & Growth. R-05 VP Events (holds the Treasurer Function)." },
        { label:"Control & Support layer", text:"R-06 Secretary (strategic direction: R-01). R-07 Vice Secretary (under R-06). R-08 Club Auditor (full independence on findings). R-09 Treasurer (embedded under R-05). R-10 Vice Treasurer (under R-09/R-05). R-11 AWI Officer (strategic direction: R-01, not embedded in any portfolio)." },
        { label:"Departmental codes", text:"Brand & Content: R-12 HOD, R-13 vHOD. Partnerships & Growth (parallel-leader structure): R-14 HOD, R-15 External Partnership Leader, R-16 Internal Partnership Leader. People & Operations: R-17 HOD, R-18 Operations vHOD, R-19 People vHOD. Events: R-20 HOD, R-21 vHOD (R-09/R-10 coordinate operationally here too)." },
        { label:"RACI — the four roles", text:"Responsible: the actual human doing the work — never assigned to 'the team.' Accountable: usually the relevant VP or HOD, who owns the outcome and answers for it. Consulted: whose input is needed before a decision — consult only relevant people, not everyone. Informed: updated after the decision/action, not before, unless their input is required." },
        { label:"RACI — R-08 and R-11 boundaries", text:"R-08 may be Consulted or Informed on governance/finance/compliance matters but is never Responsible for execution work being audited. R-11 may be Consulted or Informed on digital/AI decisions and is Responsible for technology execution within their own mandate. R-06 is Responsible for records systems across departments and Informed on all documentation-related tasks." }
      ]}
    ]
  },
  {
    id: "department-training",
    level: 2,
    levelTitle: "Know Your Role",
    title: "Level 2 — Department Training",
    description: "How your department actually works day to day — workflow, standards and the identity SEC looks for in each function. Departments replace the placeholder guidance here with their own SOPs as they're finalised (see the closing section).",
    estimatedMinutes: 35,
    sections: [
      { id: "dept-operating-norms", title: "How Departments Operate at SEC", clauses: [
        { label:"The chain of work", text:"Every deliverable moves through: brief → draft → internal review → approval → publish or execute. Skipping the review step is not a shortcut — it produces exactly the mistakes the Charter's no-self-approval rule (cl. 16(g)) exists to catch." },
        { label:"No self-approval", text:"You may not approve your own budget, content or deliverable. A second person — your Head, a Vice President, or a peer with equivalent authority — signs off before anything goes external." },
        { label:"Escalate early, not late", text:"If you are blocked for more than 48 hours — waiting on an approval, a decision, or a resource — escalate to your Head. A blocker you sit on quietly is what turns a small delay into a missed deadline." },
        { label:"Weekly reporting", text:"Every member reports weekly: what you shipped, what's blocked, what's next. A one-line 'no update' is still a report — it tells your Head nothing is wrong. Missing the report entirely is worse than a bad one." },
        { label:"Cross-department work", text:"When a project needs two departments, the Project Lead owns coordinating them — not either department Head. Department Heads own the quality of their department's contribution; the Project Lead owns whether the pieces fit together on time." },
        { label:"Tools", text:"Use the tools your department has standardised on, not a personal alternative only you can access. If a task can't be picked up by someone else without asking you first, it isn't documented properly yet." },
        { label:"✓ Good — escalating early", kind:"good", text:"A member flags on Monday that a sponsor deck won't be ready by Wednesday because the sponsor hasn't sent their logo pack. Their Head follows up with the sponsor the same day; the deck ships on time." },
        { label:"✗ Poor — escalating late", kind:"bad", text:"A member waits until Wednesday morning to mention the same problem. There is no time left to fix it, and the deck ships incomplete." },
        { label:"Scenario", kind:"scenario", text:"You're two days from a deadline and realise your task depends on another department's output, which hasn't arrived. Do you message that department's Head first, message your own Head first, or keep waiting a bit longer? Work out your answer — the check will ask you to apply it." }
      ]},
      { id: "dept-brand-content", title: "Brand & Content — Working Standard", clauses: [
        { label:"Identity — Obsessed", text:"Brand & Content is for people who notice weak hooks, bad layouts, poor editing and inconsistent branding — and can't leave it alone. If a badly cropped photo doesn't bother you on sight, the mismatch isn't talent, it's fit." },
        { label:"Brand standards", text:"Every asset carries the same logo lockup, colour system and type pairing defined in the SEC brand kit. One exception for a rushed event becomes the excuse for the next ten — consistency is the actual product this department produces." },
        { label:"Content strategy", text:"Content is planned around what the audience needs to believe next — recruitment authority, event turnout, sponsor confidence — not around whatever is easiest to film this week." },
        { label:"Workflow & approval", text:"Brief → shoot or design → edit → internal review → Head approval → publish. Content does not go live without a second set of eyes, regardless of deadline pressure." },
        { label:"Asset management", text:"Raw footage, source files and final exports go to the shared Drive with a dated, described filename — not left on one person's laptop. The next Brand & Content member should be able to find and reuse it without asking you." },
        { label:"Analytics", text:"Every published post gets checked against reach, saves and click-through 48–72 hours after posting. Content nobody ever reviews is being produced, not learned from." },
        { label:"✓ Good — on-brand and reviewed", kind:"good", text:"A recruitment carousel uses the current logo lockup and approved caption voice, and a second person reviews it before it posts." },
        { label:"✗ Poor — rushed and unreviewed", kind:"bad", text:"The same carousel reuses last year's logo because it was faster to find, and goes live without anyone else reviewing it." },
        { label:"Scenario", kind:"scenario", text:"Your Head is unreachable and a post is due in an hour. It's otherwise ready but doesn't quite match brand guidelines. Do you publish on time or hold it? What does 'Our Standard' — ownership and quality together — tell you to prioritise?" }
      ]},
      { id: "dept-partnerships", title: "Partnerships — Working Standard", clauses: [
        { label:"Identity — Relentless", text:"Partnerships is for people who research before they reach out, follow up properly, and don't stop after one rejection. If 'no response' from a company ends your involvement, the fit isn't right." },
        { label:"Research before outreach", text:"Before contacting any organisation, know who they are, what they've supported before, and what SEC can genuinely offer them — not only what SEC wants from them." },
        { label:"Outreach standard", text:"A cold message states who you are, why you're reaching out to this specific organisation, and one concrete ask. Generic mass-messages get generic non-responses." },
        { label:"Follow-up", text:"No response within 5–7 working days gets one polite follow-up. Two follow-ups with no response means the lead goes cold for now — it does not mean messaging indefinitely." },
        { label:"Value exchange", text:"Every pitch names what SEC gives the partner — student reach, event visibility, a talent pipeline — alongside what SEC is asking for. A one-sided ask reads as a favour, not a partnership." },
        { label:"Stakeholder accuracy", text:"You represent SEC to people outside the club. Confirm dates, numbers and commitments before you state them out loud — a partner who catches SEC in a wrong detail stops trusting the next one." },
        { label:"✓ Good — a specific, researched pitch", kind:"good", text:"An outreach email names the company's recent initiative, proposes one concrete collaboration, and states exactly what SEC can offer in return." },
        { label:"✗ Poor — a generic mass-send", kind:"bad", text:"The same email is copy-pasted to twenty companies with no reference to any of them individually, and no clear ask." },
        { label:"Scenario", kind:"scenario", text:"A sponsor verbally agreed to a RM2,000 contribution three weeks ago but hasn't signed anything or transferred funds. What do you do, and by when?" }
      ]},
      { id: "dept-awi", title: "AWI — Working Standard", clauses: [
        { label:"Identity — Builder", text:"AWI is for people who look at repetitive manual work and think 'why are we still doing this by hand.' If a spreadsheet-and-copy-paste workflow doesn't bother you, the fit isn't right." },
        { label:"Scope of ownership", text:"AWI owns platform design, workflows, automation, user experience, databases, analytics, system integration and maintenance. AWI does not own department knowledge or recruitment positioning — it builds the system those live in." },
        { label:"Build discipline", text:"Do not start building before the underlying process is defined — the website cannot solve unclear organisational design. A polished form for an undefined process just automates the confusion." },
        { label:"Documentation & handover", text:"Every system AWI builds needs a plain-language note on what it does, where the data lives, and who has admin access — written for whoever inherits it next term, not just for the person who built it." },
        { label:"Maintenance mindset", text:"A tool nobody maintains after its builder graduates quietly breaks. Before shipping something new, name who owns it going forward." },
        { label:"✓ Good — automate the repeat", kind:"good", text:"A recurring form-to-sheet copy task that eats an hour a week gets replaced with a script; the hour goes back to the person who used to do it manually." },
        { label:"✗ Poor — automate for its own sake", kind:"bad", text:"A one-time event with twenty entries gets a fully custom database built for it, taking longer than just using a spreadsheet would have." },
        { label:"Scenario", kind:"scenario", text:"A department asks you to build a fully custom database in one week for a one-time event with 20 entries. Do you build custom, or use an existing tool? What should decide it?" }
      ]},
      { id: "dept-submission-template", title: "Department Knowledge — What Every Department Must Document", clauses: [
        { label:"Purpose & responsibilities", text:"Every department needs a one-paragraph purpose statement and a list of concrete responsibilities — not just a title. If a new member can't tell what the department does from this alone, it isn't finished." },
        { label:"Authority boundaries", text:"State clearly what a member in this department can decide alone, what needs Head sign-off, and what needs VP or President sign-off." },

/* ═══════════════ PROGRESS HELPERS ═══════════════ */
function secStatus(subjId, secId) {
  const d = currentUser?.data?.subjects?.[subjId]?.sections?.[secId];
  return d?.status || "not-started";
}
function secData(subjId, secId) {
  return currentUser?.data?.subjects?.[subjId]?.sections?.[secId] || null;
}
function subjDoneCount(subj) {
  return subj.sections.filter(s => secStatus(subj.id, s.id) === "complete").length;
}
function subjStatus(subj) {
  const done = subjDoneCount(subj);
  if (done === subj.sections.length) return "complete";
  const any = subj.sections.some(s => secStatus(subj.id, s.id) !== "not-started");
  return any ? "in-progress" : "not-started";
}
function sectionUnlocked(subj, idx) {
  if (idx === 0) return true;
  return secStatus(subj.id, subj.sections[idx-1].id) === "complete";
}
function levelUnlocked(subj) {
  const lvl = subj.level || 1;
  if (lvl <= 1) return true;
  return SUBJECTS.filter(s => (s.level || 1) < lvl).every(s => subjStatus(s) === "complete");
}
function saveUser() { sessionStorage.setItem("sec_user", JSON.stringify(currentUser)); }

/* ═══════════════ LOGIN VIEW ═══════════════ */
function renderLogin(msg) {
  app.innerHTML = `
  <div class="login-wrap"><div class="login-card">
    <div class="login-head">
      <img class="brand-mark lg" src="${LOGO_SRC}" alt="SEC logo">
      <h1>SEC Learning Portal</h1>
      <div class="tagline">Know what you're here to do.</div>
    </div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    <div id="login-err"></div>
    <div class="field"><label>Full name</label><input id="li-name" autocomplete="name" placeholder="e.g. Amadeus Liew"></div>
    <div class="field"><label>Email address</label><input id="li-email" type="email" autocomplete="email" placeholder="you@imail.sunway.edu.my"></div>
    <div class="field"><label>Club password</label><input id="li-pw" type="password" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="li-btn" style="width:100%">Enter the portal</button>
    <div class="login-foot"><button id="admin-link">Admin access →</button></div>
  </div></div>`;
  $("#li-btn").onclick = doLogin;
  $("#li-pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("#admin-link").onclick = adminGate;
}

async function doLogin() {
  const name = $("#li-name").value.trim(), email = $("#li-email").value.trim(), password = $("#li-pw").value;
  const errBox = $("#login-err");
  errBox.innerHTML = "";
  if (!name || !email || !password) { errBox.innerHTML = `<div class="err">Fill in all three fields to continue.</div>`; return; }
  const btn = $("#li-btn");
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Loading...`;
  try {
    const r = await api({ action: "login", name, email, password });
    if (r.error) { errBox.innerHTML = `<div class="err">${esc(r.error)}</div>`; btn.disabled = false; btn.textContent = "Enter the portal"; return; }
    sessionToken = r.token;
    currentUser = { name: r.name, email: email.toLowerCase().trim(), role: r.role, data: r.data };
    sessionStorage.setItem("sec_token", sessionToken);
    saveUser();
    renderDashboard();
  } catch(e) {
    errBox.innerHTML = `<div class="err">Could not reach the portal server. Check your connection and try again.</div>`;
    btn.disabled = false; btn.textContent = "Enter the portal";
  }
}

function adminGate() {
  const key = prompt("Enter admin key:");
  if (!key) return;
  sessionStorage.setItem("sec_admin_key", key);
  renderAdmin();
}

function signOut() {
  sessionStorage.removeItem("sec_token");
  sessionStorage.removeItem("sec_user");
  sessionToken = null; currentUser = null;
  renderLogin();
}

/* ═══════════════ DASHBOARD ═══════════════ */
function renderDashboard() {
  const h = new Date().getHours();
  const tod = h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
  const first = (currentUser.name || "").split(" ")[0];
  const totalSubj = SUBJECTS.length;
  const doneSubj = SUBJECTS.filter(s => subjStatus(s) === "complete").length;

  const levels = [...new Set(SUBJECTS.map(s => s.level || 1))].sort((a,b) => a-b);
  const groups = levels.map(lvl => {
    const subjsInLevel = SUBJECTS.filter(s => (s.level || 1) === lvl);
    const levelTitle = subjsInLevel[0].levelTitle || "";
    const cards = subjsInLevel.map(subj => {
      const done = subjDoneCount(subj), total = subj.sections.length;
      const pct = Math.round(done / total * 100);
      const st = subjStatus(subj);
      const unlocked = levelUnlocked(subj);
      const chip = !unlocked ? `<span class="chip grey">🔒 Locked</span>` : st === "complete" ? `<span class="chip green">Complete</span>` : st === "in-progress" ? `<span class="chip amber">In progress</span>` : `<span class="chip grey">Not started</span>`;
      const circ = 2 * Math.PI * 26;
      return `<div class="card ${unlocked ? "" : "locked"}">
        <div class="row">
          <div class="ring-wrap">
            <svg class="ring" width="64" height="64" viewBox="0 0 64 64">
              <circle class="bg" cx="32" cy="32" r="26" fill="none" stroke-width="6"/>
              <circle class="fg" cx="32" cy="32" r="26" fill="none" stroke-width="6"
                stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct/100)}"/>
            </svg>
            <div class="ring-num">${pct}%</div>
          </div>
          <div style="flex:1">
            <h3>${esc(subj.title)}</h3>
            <div class="desc">${esc(subj.description)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div class="meta"><span>${total} sections</span><span>~${subj.estimatedMinutes} min</span>${chip}</div>
          <button class="btn btn-primary btn-sm" ${unlocked ? "" : "disabled"} onclick="openSubject('${subj.id}')">${!unlocked ? "Locked" : st === "not-started" ? "Start" : st === "complete" ? "Review" : "Continue"}</button>
        </div>
      </div>`;
    }).join("");
    return `<div class="level-group">
      <div class="level-head"><h2>Level ${lvl}</h2><span class="lt">${esc(levelTitle)}</span></div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join("");

  app.innerHTML = topbar() + `<div class="shell">
    <h1 class="greeting">Good ${tod}, ${esc(first)}.</h1>
    <div class="role-badge">${esc(currentUser.role || "Member")}</div>
    <div class="overall">
      <div class="lbl">${doneSubj} of ${totalSubj} subject${totalSubj === 1 ? "" : "s"} complete</div>
      <div class="pbar"><div style="width:${totalSubj ? Math.round(doneSubj/totalSubj*100) : 0}%"></div></div>
    </div>
    ${groups}
  </div>`;
}

/* ═══════════════ SUBJECT VIEW ═══════════════ */
let curSubj = null, curSecIdx = 0;

function openSubject(id) {
  curSubj = SUBJECTS.find(s => s.id === id);
  if (!levelUnlocked(curSubj)) { curSubj = null; return; }
  // land on first incomplete unlocked section
  curSecIdx = 0;
  for (let i = 0; i < curSubj.sections.length; i++) {
    if (secStatus(curSubj.id, curSubj.sections[i].id) !== "complete") { curSecIdx = i; break; }
    if (i === curSubj.sections.length - 1) curSecIdx = i;
  }
  renderSubject("reader");
}

function renderSubject(mode, payload) {
  const subj = curSubj;
  const sidebar = subj.sections.map((sec, i) => {
    const st = secStatus(subj.id, sec.id);
    const unlocked = sectionUnlocked(subj, i);
    let dot;
    if (st === "complete") dot = `<span class="sec-dot done">✓</span>`;
    else if (!unlocked) dot = `<span class="sec-dot">🔒</span>`;
    else if (st === "in-progress") dot = `<span class="sec-dot progress">${i+1}</span>`;
    else dot = `<span class="sec-dot">${i+1}</span>`;
    return `<button class="sec-item ${i === curSecIdx ? "active" : ""}" ${unlocked ? "" : "disabled"} onclick="gotoSection(${i})">${dot}<span>${esc(sec.title)}</span></button>`;
  }).join("");

  app.innerHTML = topbar() + `<div class="shell">
    <button class="back-link" onclick="renderDashboard()">← All subjects</button>
    <h1 style="font-size:26px;margin-bottom:4px">${esc(subj.title)}</h1>
    <p style="color:var(--muted);margin-bottom:22px">${esc(subj.description)}</p>
    <div class="subj-layout">
      <div class="sidebar">${sidebar}</div>
      <div class="subj-main" id="subj-main"></div>
    </div>
  </div>`;

  if (mode === "quiz") startQuiz();
  else if (mode === "section-complete") renderSectionComplete(payload);
  else if (mode === "subject-complete") renderSubjectComplete();
  else renderReader();
}

function gotoSection(i) {
  if (!sectionUnlocked(curSubj, i)) return;
  curSecIdx = i;
  renderSubject("reader");
}

/* ═══════════════ READER ═══════════════ */
function renderReader() {
  const subj = curSubj, sec = subj.sections[curSecIdx];
  const already = secStatus(subj.id, sec.id) === "complete";
  const sdExisting = secData(subj.id, sec.id);
  const hasPriorAttempt = !!(sdExisting && (sdExisting.attempts || []).length > 0);

  const clauses = sec.clauses.map(c => `<div class="clause-block ${esc(c.kind||"")}">
    <div class="clause-label">${esc(c.label)}</div><p>${esc(c.text)}</p>
  </div>`).join("");

  let msg;
  if (already) msg = "You've already passed this section — review freely or retake the check.";
  else if (hasPriorAttempt) msg = "You've attempted this section before — retake the check whenever you're ready.";
  else msg = "Read through this section, then take the comprehension check whenever you're ready.";

  $("#subj-main").innerHTML = `
    <div class="reader-head">
      <div class="eyebrow">Section ${curSecIdx+1} of ${subj.sections.length} — ${esc(subj.title)}</div>
      <h1>${esc(sec.title)}</h1>
    </div>
    <div class="reader-body" id="reader-body">${clauses}</div>
    <div class="timer-banner" id="timer-banner">
      <span id="timer-msg">${msg}</span>
      <button class="btn btn-primary" id="quiz-btn">Take comprehension check →</button>
    </div>`;

  $("#quiz-btn").onclick = () => { renderSubject("quiz"); };
}

/* ═══════════════ QUIZ ═══════════════ */
let quiz = null;

async function startQuiz() {
  const subj = curSubj, sec = subj.sections[curSecIdx];
  $("#subj-main").innerHTML = `<div class="quiz-wrap" style="text-align:center;padding:70px 30px;color:var(--muted)"><span class="spin" style="border-color:var(--amber-line);border-top-color:var(--amber)"></span>&nbsp; Loading comprehension check…</div>`;
  const r = await api({ action: "getQuestions", subjectId: subj.id, sectionId: sec.id });
  if (r.error) { $("#subj-main").innerHTML = `<div class="quiz-wrap"><div class="err">${esc(r.error)}</div><button class="btn btn-ghost" onclick="renderSubject('reader')">← Back to reading</button></div>`; return; }
  quiz = { questions: r.questions, quizKey: r.quizKey, idx: 0, answers: new Array(r.questions.length).fill(null), started: Date.now() };
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.questions[quiz.idx];
  const letters = "ABCD";
  const opts = q.options.map((opt, i) => `
    <button class="opt ${quiz.answers[quiz.idx] === opt ? "sel" : ""}" onclick="pickOption(${i})">
      <span class="letter">${letters[i] || i+1}</span><span>${esc(opt)}</span>
    </button>`).join("");
  const last = quiz.idx === quiz.questions.length - 1;
  $("#subj-main").innerHTML = `<div class="quiz-wrap">
    <div class="q-progress">Question ${quiz.idx+1} of ${quiz.questions.length}</div>
    <div class="q-text">${esc(q.q)}</div>
    ${opts}
    <div class="quiz-foot">
      <button class="btn btn-primary" id="q-next" ${quiz.answers[quiz.idx] === null ? "disabled" : ""}>${last ? "Submit answers" : "Next →"}</button>
    </div>
  </div>`;
  $("#q-next").onclick = () => {
    if (quiz.idx < quiz.questions.length - 1) { quiz.idx++; renderQuestion(); }
    else submitQuiz();
  };
}

function pickOption(i) {
  quiz.answers[quiz.idx] = quiz.questions[quiz.idx].options[i];
  renderQuestion();
}

async function submitQuiz() {
  const btn = $("#q-next");
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Grading…`;
  const subj = curSubj, sec = subj.sections[curSecIdx];
  const timeSeconds = Math.round((Date.now() - quiz.started) / 1000);
  const r = await api({ action: "grade", quizKey: quiz.quizKey, answers: quiz.answers, timeSeconds });
  if (r.error) {
    $("#subj-main").innerHTML = `<div class="quiz-wrap"><div class="err">${esc(r.error)}</div><button class="btn btn-ghost" onclick="renderSubject('reader')">← Back to reading</button></div>`;
    return;
  }
  // sync progress from server
  try {
    const p = await api({ action: "getProgress" });
    if (p.data) { currentUser.data = p.data; saveUser(); }
  } catch(e) {}
  renderQuizResults(r, timeSeconds);
}

function renderQuizResults(r, timeSeconds) {
  const letters = "ABCD";
  const blocks = quiz.questions.map((q, qi) => {
    const res = r.results[qi];
    const opts = q.options.map((opt, i) => {
      const chosen = quiz.answers[qi] === opt;
      let cls = "";
      if (chosen && res.correct) cls = "right";
      else if (chosen && !res.correct) cls = "wrong";
      return `<div class="opt ${cls}" style="cursor:default">
        <span class="letter">${letters[i] || i+1}</span><span>${esc(opt)} ${chosen && res.correct ? "✓" : chosen ? "✗" : ""}</span>
      </div>`;
    }).join("");
    const explain = !res.correct && res.explain ? `<div class="explain">${esc(res.explain)}</div>` : "";
    return `<div style="margin-bottom:26px"><div class="q-text" style="font-size:16.5px">${qi+1}. ${esc(q.q)}</div>${opts}${explain}</div>`;
  }).join("");

  const passed = r.passed;
  const footer = passed
    ? `<button class="btn btn-primary" onclick="afterPass(${r.score},${r.total},${timeSeconds})">Continue →</button>`
    : `<button class="btn btn-primary" onclick="renderSubject('reader')">Review section and try again</button>`;

  $("#subj-main").innerHTML = `<div class="quiz-wrap">
    <div class="${passed ? "ok-note" : "err"}" style="font-size:15px">
      ${passed ? "Passed" : "Not quite"} — you scored <b>${r.score}/${r.total}</b>${passed ? "." : " (80% needed). Re-read the section, then the check will unlock again."}
    </div>
    ${blocks}
    <div class="quiz-foot">${footer}</div>
  </div>`;
}

function afterPass(score, total, timeSeconds) {
  const subj = curSubj;
  const allDone = subj.sections.every(s => secStatus(subj.id, s.id) === "complete");
  if (allDone) renderSubject("subject-complete");
  else renderSubject("section-complete", { score, total, timeSeconds });
}

function renderSectionComplete(p) {
  const subj = curSubj, sec = subj.sections[curSecIdx];
  const mins = Math.floor(p.timeSeconds / 60), secs = p.timeSeconds % 60;
  $("#subj-main").innerHTML = `<div class="celebrate">
    <div class="big">🎉</div>
    <h2>Section complete</h2>
    <p style="color:var(--muted)">${esc(sec.title)} — nicely done. That's one more piece of ${esc(curSubj.title)} you can act on.</p>
    <div class="stats">
      <div><b>${p.score}/${p.total}</b>Score</div>
      <div><b>${mins}m ${secs}s</b>Time taken</div>
    </div>
    <button class="btn btn-primary" onclick="nextSection()">Continue →</button>
  </div>`;
}

function nextSection() {
  if (curSecIdx < curSubj.sections.length - 1) { curSecIdx++; renderSubject("reader"); }
  else renderSubject("subject-complete");
}

function renderSubjectComplete() {
  const subj = curSubj;
  let totalTime = 0, totalScore = 0, totalMax = 0;
  subj.sections.forEach(s => {
    const d = secData(subj.id, s.id);
    if (d) {
      totalTime += d.timeSpentSeconds || 0;
      const best = (d.attempts || []).slice().reverse().find(a => a.total && (a.score/a.total) >= .8) || (d.attempts||[])[d.attempts.length-1];
      if (best) { totalScore += best.score; totalMax += best.total; }
    }
  });
  const avg = totalMax ? Math.round(totalScore/totalMax*100) : 0;
  $("#subj-main").innerHTML = `<div class="celebrate">
    <div class="big">🏆</div>
    <h2>${esc(subj.title)} — complete</h2>
    <p style="color:var(--muted);max-width:420px">Every section passed. That's ${esc((subj.levelTitle||"this level").toLowerCase())} — done.</p>
    <div class="stats">
      <div><b>${subj.sections.length}</b>Sections</div>
      <div><b>${Math.round(totalTime/60)}m</b>Total time</div>
      <div><b>${avg}%</b>Avg score</div>
    </div>
    <button class="btn btn-primary" onclick="renderDashboard()">Back to all subjects →</button>
  </div>`;
}

/* ---- members tab ---- */
function totalSections() { return SUBJECTS.reduce((n,s)=>n+s.sections.length,0); }
function fmtTime(s) {
  s = Math.round(s || 0);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), r = s % 60;
  return r ? `${m}m ${r}s` : `${m}m`;
}

function memberStats(m) {
  let passed = 0, attempts = 0, time = 0, last = m.lastActive || 0;
  SUBJECTS.forEach(subj => subj.sections.forEach(sec => {
    const d = m.subjects?.[subj.id]?.sections?.[sec.id];
    if (!d) return;
    if (d.status === "complete") passed++;
    attempts += (d.attempts || []).length;
    time += d.timeSpentSeconds || 0;
  }));
  return { passed, attempts, time, last };
}

function renderMembersTab() {
  const total = totalSections();
  const ms = adminData.members;
  const started = ms.length;
  let cleared = 0, inprog = 0, totAtt = 0;
  const rows = ms.map((m, i) => {
    const s = memberStats(m);
    totAtt += s.attempts;
    if (s.passed === total) cleared++;
    else if (s.passed > 0 || s.attempts > 0) inprog++;
    const chip = s.passed === total ? `<span class="chip green">Complete</span>` : (s.passed>0||s.attempts>0) ? `<span class="chip amber">In progress</span>` : `<span class="chip grey">Not started</span>`;
    return `<tr onclick="openDetail(${i})">
      <td><b>${esc(m.name)}</b><br><span style="color:var(--muted);font-size:12px">${esc(m.email)}</span></td>
      <td><span class="role-badge" style="margin:0">${esc(m.role||"Member")}</span></td>
      <td><span class="minibar"><div style="width:${total?Math.round(s.passed/total*100):0}%"></div></span>${s.passed}/${total}</td>
      <td>${chip}</td>
      <td>${s.attempts}</td>
      <td>${fmtTime(s.time)}</td>
      <td style="font-size:12px;color:var(--muted)">${s.last ? new Date(s.last).toLocaleString() : "—"}</td>
      <td><button class="del-x" onclick="event.stopPropagation();delMember('${esc(m.email)}')" title="Delete member">✕</button></td>
    </tr>`;
  }).join("");

  const regWarn = adminData.registerCount === 0 ? `<div class="warn-banner">⚠ Register is empty — any email can log in with the club password. Add committee emails in Settings to enforce access control.</div>` : "";

  $("#admin-body").innerHTML = regWarn + `
    <div class="stat-grid">
      <div class="stat"><div class="n">${started}</div><div class="l">Members started</div></div>
      <div class="stat"><div class="n">${cleared}</div><div class="l">Fully cleared</div></div>
      <div class="stat"><div class="n">${inprog}</div><div class="l">In progress</div></div>
      <div class="stat"><div class="n">${totAtt}</div><div class="l">Total attempts</div></div>
    </div>
    <table class="members">
      <thead><tr><th>Member</th><th>Role</th><th>Sections passed</th><th>Status</th><th>Attempts</th><th>Time</th><th>Last active</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:26px">No members have logged in yet.</td></tr>`}</tbody>
    </table>`;
}

async function delMember(email) {
  if (!confirm(`Delete all progress for ${email}? This cannot be undone.`)) return;
  const r = await api({ action: "deleteMember", email, adminKey: adminKey() });
  if (r.error) alert(r.error);
  renderAdmin();
}

function openDetail(i) {
  const m = adminData.members[i];
  const rows = [];
  const attBlocks = [];
  SUBJECTS.forEach(subj => subj.sections.forEach(sec => {
    const d = m.subjects?.[subj.id]?.sections?.[sec.id];
    const st = d?.status || "not-started";
    const chip = st === "complete" ? `<span class="chip green">Complete</span>` : st === "in-progress" ? `<span class="chip amber">In progress</span>` : `<span class="chip grey">—</span>`;
    const atts = d?.attempts || [];
    const lastAtt = atts.length ? new Date(atts[atts.length-1].ts).toLocaleString() : "—";
    rows.push(`<tr><td>${esc(sec.title)}</td><td>${chip}</td><td>${d?d.bestScore:0}${atts.length?"/"+(atts[atts.length-1].total||"?"):""}</td><td>${atts.length}</td><td>${d?fmtTime(d.timeSpentSeconds||0):"—"}</td><td style="font-size:11.5px">${lastAtt}</td></tr>`);
    if (atts.length) {
      const inner = atts.map((a, ai) => {
        const qr = (a.questionResults||[]).map((q, qi) =>
          `<div class="qr">Q${qi+1}: Selected “${esc((q.selectedOption||"").slice(0,60))}${(q.selectedOption||"").length>60?"…":""}” <span class="${q.correct?"yes":"no"}">${q.correct?"✓":"✗"}</span></div>`).join("");
        return `<div class="att">
          <div class="hd">Attempt ${ai+1} (${new Date(a.ts).toLocaleString()}) — Score: ${a.score}/${a.total}
          ${a.total && a.score/a.total >= .8 ? '<span style="color:var(--green)">PASSED</span>' : ''}</div>
          ${qr}</div>`;
      }).join("");
      attBlocks.push(`<details class="attempts"><summary>${esc(sec.title)} — ${atts.length} attempt${atts.length>1?"s":""}</summary>${inner}</details>`);
    }
  }));

  $("#panel-root").innerHTML = `
    <div class="panel-overlay" onclick="closeDetail()"></div>
    <div class="detail-panel">
      <button class="back-link" onclick="closeDetail()">← Close</button>
      <h2>${esc(m.name)}</h2>
      <div class="sub">${esc(m.email)} · <span class="role-badge" style="margin:0">${esc(m.role||"Member")}</span></div>
      <h3 style="font-size:15px;margin-bottom:8px">Per-section breakdown</h3>
      <table class="breakdown"><thead><tr><th>Section</th><th>Status</th><th>Best</th><th>Attempts</th><th>Time</th><th>Last attempt</th></tr></thead><tbody>${rows.join("")}</tbody></table>
      <h3 style="font-size:15px;margin-bottom:8px">Attempt history</h3>
      ${attBlocks.join("") || `<p style="color:var(--muted);font-size:13.5px">No attempts yet.</p>`}
      <div style="margin-top:22px"><button class="btn btn-danger btn-sm" onclick="delMember('${esc(m.email)}')">Delete member</button></div>
    </div>`;
}

function renderManQuestions() {

function useSectionText() {
  const subj = SUBJECTS.find(s => s.id === $("#gen-subj").value);

  $("#gen-content").value = sec.clauses.map(c => c.label + "\n" + c.text).join("\n\n");
